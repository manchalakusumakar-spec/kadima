name: NIFTY precision release plan (NO AWS APPLY)
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed commit; must equal selected branch HEAD
        required: true
        type: string
permissions:
  contents: read
jobs:
  plan-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Validate source and print unresolved rollout gates
        env:
          REVIEWED_SHA: ${{ inputs.release_sha }}
        run: python forecast_precision/release_plan.py --release-sha "$REVIEWED_SHA"
      - name: Explicit no-deployment receipt
        run: echo 'Plan only. No AWS credentials, SSM commands, service changes or trading activation.'
