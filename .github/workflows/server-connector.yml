name: Read-only server connector
on:
  pull_request:
    paths:
      - 'server_connector/**'
      - '.github/workflows/server-connector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server_connector/requirements.lock pytest==9.1.1
      - run: python -m pytest -q server_connector/test_connector.py
      - run: python server_connector/install.py
