name: 20-Oct forecast milestones and reforecast
on:
  push:
    branches: [claude/forecast-milestones-chart-20261020]
  pull_request:
    paths: ['kadima/hourly_forecast.py', 'web/**', 'tools/*forecast_milestones_20261020*', 'tools/install_celestial_embed.py',
            '.github/workflows/forecast-milestones-20261020.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORDER_PLACEMENT_ENABLED: '0'
      KADIMA_CELESTIAL_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make sure the base branches are present
        run: |
          for b in claude/trend-band-rules-20261019 claude/forecast-scoring-integrity-20261020 main; do
            git rev-parse --verify -q "origin/$b" >/dev/null || git fetch --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b"
          done
      - name: Overlay config.py (the EC2 snapshot omits it; tests only)
        run: git show origin/main:kadima/config.py > kadima/config.py
      - name: Compile
        run: python -m compileall -q kadima tools
      - name: Panel scripts parse
        run: |
          node --check web/celestial_forecast_embed.js
          python - <<'PY'
          import re; html = open('web/hourly_forecast.html').read()
          open('/tmp/panel.js', 'w').write('\n'.join(re.findall(r'<script>(.*?)</script>', html, re.S)))
          PY
          node --check /tmp/panel.js
      - name: Hourly forecast model tests
        run: KADIMA_DATA_DIR=$(mktemp -d) python tools/test_hourly_forecast.py
      - name: Scoring integrity tests (PR #47)
        run: KADIMA_DATA_DIR=$(mktemp -d) python tools/test_forecast_scoring_20261020.py
      - name: Milestone chart and 5-point reforecast tests
        run: KADIMA_DATA_DIR=$(mktemp -d) python tools/test_forecast_milestones_20261020.py
      - name: Installer (over live base and over PR #47, re-run, rollback, refuse unknown file)
        run: bash tools/test_install_forecast_milestones_20261020.sh "$PWD"
      - name: Trend and band rules still pass (they read forecast bands)
        run: KADIMA_DATA_DIR=$(mktemp -d) python tools/test_trend_rules_20261019.py
