name: KADIMA guarded EC2 operations
# Manual, audited, environment-approved maintenance channel.
# Never places orders or modifies trading controls.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Approved fixed operation
        type: choice
        required: true
        options:
          - status
          - connector_status
          - connector_restart
      reason:
        description: Change ticket / justification
        type: string
        required: true
permissions:
  id-token: write
  contents: read
concurrency:
  group: kadima-ec2-maintenance
  cancel-in-progress: false
jobs:
  guarded-ec2:
    runs-on: ubuntu-latest
    environment: kadima-production-admin
    timeout-minutes: 8
    steps:
      - name: Validate configuration
        env:
          INSTANCE: ${{ vars.KADIMA_EC2_INSTANCE_ID }}
          ROLE: ${{ vars.KADIMA_AWS_OIDC_ROLE_ARN }}
          REGION: ${{ vars.KADIMA_AWS_REGION }}
        run: |
          set -euo pipefail
          [[ "$INSTANCE" =~ ^i-[a-f0-9]{8,17}$ ]] || exit 2
          [[ "$ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9_+=,.@/-]+$ ]] || exit 2
          [[ "$REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]] || exit 2
      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.KADIMA_AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.KADIMA_AWS_REGION }}
          role-session-name: kadima-guarded-ec2
      - name: Execute fixed SSM operation
        shell: bash
        env:
          INSTANCE: ${{ vars.KADIMA_EC2_INSTANCE_ID }}
          OPERATION: ${{ inputs.operation }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          echo "Requested operation: $OPERATION"
          echo "Justification supplied: ${REASON:+yes}"
          case "$OPERATION" in
            status)
              COMMAND='date -Is; uptime; free -h; df -h /; systemctl is-active kadima.service || true; git -C /home/ubuntu/kadima-py rev-parse HEAD'
              ;;
            connector_status)
              COMMAND='systemctl is-active kadima-connector.service || true; systemctl is-active kadima-connector-collect.timer || true; systemctl show kadima-connector.service -p MainPID -p ActiveState'
              ;;
            connector_restart)
              COMMAND='sudo -n systemctl restart kadima-connector.service; systemctl is-active kadima-connector.service'
              ;;
            *) exit 2 ;;
          esac
          # Fixed commands only; no caller-supplied shell, file path or script.
          ID=$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters "$(jq -nc --arg cmd "$COMMAND" '{commands:[$cmd],executionTimeout:["90"]}')" \
            --comment "KADIMA approved operation: $OPERATION" \
            --query 'Command.CommandId' --output text)
          echo "SSM command ID: $ID"
          aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCE"
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Errors:StandardErrorContent}' --output json
