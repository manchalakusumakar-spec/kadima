name: 23-Oct day path forecast (09:15-15:30) with hourly-checkpoint and 10-20 pt reforecasts
on:
  push:
    branches: [claude/day-forecast-20261023]
  pull_request:
    paths: ['kadima/hourly_forecast.py', 'web/**', 'kadima/hourly_forecast_model.py', 'tools/*forecast_swings_20261021*', 'kadima/day_forecast.py', 'tools/*day_forecast_20261023*',
            '.github/workflows/day-forecast-20261023.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORDER_PLACEMENT_ENABLED: '0'
      KADIMA_CELESTIAL_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make sure the base branches are present
        run: |
          for b in claude/trend-band-rules-20261019 claude/forecast-scoring-integrity-20261020 claude/forecast-milestones-chart-20261020 claude/forecast-swings-20261021 main; do
            git rev-parse --verify -q "origin/$b" >/dev/null || git fetch --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b"
          done
      - name: Overlay config.py (the EC2 snapshot omits it; tests only)
        run: git show origin/main:kadima/config.py > kadima/config.py
      - name: Compile
        run: python -m compileall -q kadima tools
      - name: Panel scripts parse
        run: |
          node --check web/celestial_forecast_embed.js
          python - <<'PY'
          import re; html = open('web/hourly_forecast.html').read()
          open('/tmp/panel.js', 'w').write('\n'.join(re.findall(r'<script>(.*?)</script>', html, re.S)))
          PY
          node --check /tmp/panel.js
      - name: Hourly forecast model tests
        run: KADIMA_DATA_DIR=$(mktemp -d) python tools/test_hourly_forecast.py
      - name: Scoring integrity tests (PR #47)
        run: KADIMA_DATA_DIR=$(mktemp -d) python tools/test_forecast_scoring_20261020.py
      - name: Milestone chart and 5-point reforecast tests
        run: KADIMA_DATA_DIR=$(mktemp -d) python tools/test_forecast_milestones_20261020.py
      - name: Expected swings tests (model, saving on a migrated database, view, reforecast)
        run: KADIMA_DATA_DIR=$(mktemp -d) python tools/test_forecast_swings_20261021.py
      - name: NIFTY 50 breadth shadow tests (PR #49)
        run: KADIMA_DATA_DIR=$(mktemp -d) python tools/test_nifty_breadth_20261020.py
      - name: Trend and band rules still pass (they read forecast bands)
        run: KADIMA_DATA_DIR=$(mktemp -d) python tools/test_trend_rules_20261019.py
      - name: Day path forecast tests (09:15 path, checkpoints, 10-20 pt reforecast, scoring, hourly input)
        run: KADIMA_DATA_DIR=$(mktemp -d) python tools/test_day_forecast_20261023.py
