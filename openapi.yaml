openapi: 3.1.0
info:
  title: KADIMA state API
  description: Read-only intraday state and session review for KADIMA.
  version: 0.2.0
servers:
  - url: https://YOUR-DOMAIN-HERE
paths:
  /state:
    get:
      operationId: getState
      summary: Current KADIMA indices and F&O stock universe shortlist.
      description: >
        Returns spot, Shield tier and score, technicals (VWAP, EMA20/50, MA55,
        RSI, Ichimoku, volume), option chain (ATM, PCR, max pain, OI walls, OI
        velocity alerts) per index, plus an explicit list of checklist items
        that are unavailable from this data source. Treat anything listed under
        "unavailable" as not observable - do not infer or estimate it.
        fno_universe includes the stock scanner's top20, selected option contracts,
        coverage and original timestamps. Its stock_gamma scores are separate from
        index Shield confirmation. Check status, fresh and each row/contract's
        freshness; market_closed or stale observations are historical, not live
        signals or permission to place orders. Scanner freshness measures receipt
        time, not the exchange's last trade time.
        commodities includes read-only MCX futures and option observations with
        exchange feed and trade timestamps. Context monitoring runs 24/7; quotes
        are polled in the configured weekday 09:00-23:30 IST window. This is not
        an exchange holiday calendar. MCX execution remains disabled.
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                type: object
  /session:
    get:
      operationId: getSession
      summary: Today's signals with outcomes at a fixed horizon.
      description: >
        Returns each signal, the triggers that fired, the outcome measured on
        option premium after the horizon, and a per-trigger tally. Respect
        review_guardrail - do not recommend weight changes for any trigger
        whose sample_sufficient is false.
      parameters:
        - name: day
          in: query
          required: false
          schema:
            type: string
          description: YYYY-MM-DD. Defaults to today.
      responses:
        "200":
          description: Session review data
          content:
            application/json:
              schema:
                type: object
  /health:
    get:
      operationId: getHealth
      summary: Liveness check.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
