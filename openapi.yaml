openapi: 3.1.0
info:
  title: KADIMA state API
  description: Read-only intraday state and session review for KADIMA.
  version: 0.1.0
servers:
  - url: https://YOUR-DOMAIN-HERE
paths:
  /state:
    get:
      operationId: getState
      summary: Current KADIMA state across NIFTY, BANKNIFTY, SENSEX, MIDCPNIFTY.
      description: >
        Returns spot, Shield tier and score, technicals (VWAP, EMA20/50, MA55,
        RSI, Ichimoku, volume), option chain (ATM, PCR, max pain, OI walls, OI
        velocity alerts) per index, plus an explicit list of checklist items
        that are unavailable from this data source. Treat anything listed under
        "unavailable" as not observable - do not infer or estimate it.
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                type: object
  /session:
    get:
      operationId: getSession
      summary: Today's signals with outcomes at a fixed horizon.
      description: >
        Returns each signal, the triggers that fired, the outcome measured on
        option premium after the horizon, and a per-trigger tally. Respect
        review_guardrail - do not recommend weight changes for any trigger
        whose sample_sufficient is false.
      parameters:
        - name: day
          in: query
          required: false
          schema:
            type: string
          description: YYYY-MM-DD. Defaults to today.
      responses:
        "200":
          description: Session review data
          content:
            application/json:
              schema:
                type: object
  /health:
    get:
      operationId: getHealth
      summary: Liveness check.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
